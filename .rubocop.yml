inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  NewCops: enable
  Include:
    - "**/*.rb"
    - "Gemfile"
    - "Rakefile"
    - "config.ru"
    - "bin/rails"
    - "bin/rake"
    - "bin/rspec"
    - "bin/prove-race"
    - "bin/stress"
    - "bin/verify"
  Exclude:
    - "db/structure.sql"
    - "work/**/*"
    - "outputs/**/*"

